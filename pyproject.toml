[project]
name = "pet-saude-clima-eixo2"
version = "0.1.0"
description = "Agravos relacionados à água e qualidade da água em Parauapebas (PA) — PET-Saúde CLIMA, Eixo II"
readme = "README.md"
authors = [{ name = "Rosival Soares" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pysus>=2.11.2",
    "requests>=2.34.2",
    "scipy",
    "openpyxl",  # motor do pd.read_excel (planilha do SINISA)
    "pandera",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=9.1.1",
    "pytest-cov",
    "pip-audit",
]

[tool.uv]
# Projeto de análise, não pacote instalável.
package = false
# Versões exatas da análise entregue (antigo requirements-lock.txt, gerado
# com pip freeze no Python 3.12). Mantêm o uv.lock reproduzindo o mesmo
# ambiente; só restringem pacotes que já entrariam na resolução.
constraint-dependencies = [
    "aioftp==0.21.4",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "bigtree==0.12.5",
    "boto3==1.43.90",
    "botocore==1.43.90",
    "certifi==2026.7.22",
    "chardet==7.6.0",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "contourpy==1.3.3",
    "cramjam==2.12.1",
    "cycler==0.12.1",
    "dateparser==1.4.3",
    "dbfread==2.0.7",
    "dotenv==0.9.9",
    "duckdb==1.5.5",
    "duckdb_engine==0.17.0",
    "et_xmlfile==2.0.0",
    "fastparquet==2024.11.0",
    "fonttools==4.63.0",
    "fsspec==2026.7.0",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "humanize==4.16.0",
    "idna==3.19",
    "iniconfig==2.3.0",
    "jmespath==1.1.0",
    "kiwisolver==1.5.0",
    "loguru==0.6.0",
    "markdown-it-py==4.2.0",
    "matplotlib==3.11.1",
    "mdurl==0.1.2",
    "mypy_extensions==1.1.0",
    "numpy==2.5.2",
    "openpyxl==3.1.5",
    "packaging==26.3",
    "pandas==2.3.3",
    "pandera==0.33.1",
    "pillow==12.3.0",
    "pluggy==1.6.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "Pygments==2.21.0",
    "pyparsing==3.3.2",
    "pyreaddbc==2.0.4",
    "pysus==2.11.2",
    "pytest==9.1.1",
    "python-dateutil==2.8.2",
    "python-dotenv==1.2.3",
    "pytz==2026.3.post1",
    "PyYAML==6.0.3",
    "regex==2026.9.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "s3transfer==0.19.2",
    "scipy==1.18.1",
    "shellingham==1.5.4",
    "six==1.17.0",
    "SQLAlchemy==2.0.52",
    "tqdm==4.70.0",
    "typeguard==4.6.0",
    "typer==0.24.2",
    "typing-inspect==0.9.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "tzdata==2026.3",
    "tzlocal==5.4.4",
    "Unidecode==1.4.0",
    "urllib3==2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Aviso interno da biblioteca dateutil (dependência de terceiros), sem
# efeito no projeto.
filterwarnings = ["ignore::DeprecationWarning:dateutil.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "BLE", "SIM"]

[tool.ruff.lint.per-file-ignores]
"dda/**" = ["E501"]
"sih/**" = ["E501"]
"sinan/**" = ["E501"]
