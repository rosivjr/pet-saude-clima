# O Ruff roda pelo uv, na versão travada no uv.lock: o Dependabot atualiza o
# lock e o pre-commit acompanha sem ajuste à mão. O Gitleaks tem versão fixa.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
